<!doctype html>
<html lang="ja" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f1f2f6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="KIROKU" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <title>KIROKU</title>
    <script>
      // Apply the saved light/dark choice before first paint to avoid a flash
      try { document.documentElement.dataset.theme = localStorage.getItem('kiroku-theme') || 'light' } catch {}
    </script>
  </head>
  <body data-c="all">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
